name: CoachCap
options:
  bundleIdPrefix: com.coachcam
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.3"


settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Jake Maddox (MHHL77MX8D)"
    OTHER_CODE_SIGN_FLAGS: --timestamp
    DEVELOPMENT_TEAM: MHHL77MX8D
    PRODUCT_NAME: CoachCam
    PRODUCT_BUNDLE_IDENTIFIER: com.coachcam.app
    INFOPLIST_FILE: CoachCap/Info.plist
    CODE_SIGN_ENTITLEMENTS: CoachCap/CoachCap-Release.entitlements

targets:
  CoachCap:
    type: application
    platform: macOS
    sources:
      - path: CoachCap
        includes:
          - "**/*.swift"
        excludes:
          - "**/*.md"
      - path: Resources/Quicksand.ttf
        buildPhase: resources
      # Asset catalog (app icon + CC badge etc.). Must be a `source` — XcodeGen has no target
      # `resources` key, so listing it there silently drops it from the build.
      - path: CoachCap/Assets.xcassets
    dependencies:
      - package: Sparkle
    info:
      path: CoachCap/Info.plist
      properties:
        CFBundleShortVersionString: "1.8.7"
        CFBundleVersion: "34"
        CFBundleIconName: AppIcon
        NSCameraUsageDescription: "CoachCap uses your camera to record a face-cam overlay on your screen recordings."
        NSMicrophoneUsageDescription: "CoachCap uses your microphone to record audio commentary with your screen recordings."
        SUFeedURL: "https://raw.githubusercontent.com/spectrevisuals/CoachCam/main/appcast.xml"
        SUPublicEDKey: "rduKIaou/mAjUKF6/eOVw5+kc2grUFBw1kncIoqqRaA="
        SUEnableAutomaticChecks: true
    entitlements:
      path: CoachCap/CoachCap-Release.entitlements
      properties:
        # Hardened Runtime device-access keys. NOTE: the mic key for hardened runtime is
        # `audio-input`, NOT `microphone` (that one is App Sandbox only). Shipping only
        # `microphone` silently blocked the mic prompt while camera worked. Keep all three.
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
    configurations:
      Debug:
        settings:
          CODE_SIGN_ENTITLEMENTS: CoachCap/CoachCap.entitlements

  # Hostless logic-test bundle. Compiles the dependency-free logic files (e.g. PhotoMatching)
  # directly, so tests run fast & headless with no app host / code injection / signing.
  CoachCapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: CoachCap/PhotoTool/PhotoMatching.swift
    settings:
      base:
        PRODUCT_NAME: CoachCapTests
        PRODUCT_MODULE_NAME: CoachCapTests
        PRODUCT_BUNDLE_IDENTIFIER: com.coachcam.tests
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        DEVELOPMENT_TEAM: ""

schemes:
  CoachCap:
    build:
      targets:
        CoachCap: all
        CoachCapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoachCapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
