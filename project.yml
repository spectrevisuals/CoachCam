name: CoachCap
options:
  bundleIdPrefix: com.coachcam
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.3"
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    from: "1.19.0"
  # Crash + error reporting. Pinned exactly: prebuilt Sentry binaries at 9.34.0 and earlier fail
  # Xcode's signature check (vendor certificate revoked 2026-11-13). We link the from-source
  # product (SentrySPM, `import SentrySwift`) so the SDK is compiled into the app binary and
  # there is nothing extra to sign or notarise.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: "9.35.0"


settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: Jake Maddox (MHHL77MX8D)"
    OTHER_CODE_SIGN_FLAGS: --timestamp
    DEVELOPMENT_TEAM: MHHL77MX8D
    PRODUCT_NAME: CoachCam
    PRODUCT_BUNDLE_IDENTIFIER: com.coachcam.app
    INFOPLIST_FILE: CoachCap/Info.plist
    CODE_SIGN_ENTITLEMENTS: CoachCap/CoachCap-Release.entitlements

targets:
  CoachCap:
    type: application
    platform: macOS
    # SENTRY_DSN comes from this xcconfig (empty by default; the real value lives in the
    # untracked Config/Secrets.local.xcconfig, written by Scripts/set_sentry_dsn.sh).
    # Never define SENTRY_DSN under `settings`: pbxproj settings override xcconfig values,
    # and the pbxproj is tracked in a public repo.
    configFiles:
      Debug: Config/CoachCam.xcconfig
      Release: Config/CoachCam.xcconfig
    settings:
      base:
        # The dSYM upload phase reads the sentry-cli config in the home folder and uses the
        # network, which a sandboxed script phase cannot do.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    sources:
      - path: CoachCap
        includes:
          - "**/*.swift"
        excludes:
          - "**/*.md"
      - path: Resources/Quicksand.ttf
        buildPhase: resources
      # Asset catalog (app icon + CC badge etc.). Must be a `source` — XcodeGen has no target
      # `resources` key, so listing it there silently drops it from the build.
      - path: CoachCap/Assets.xcassets
    dependencies:
      - package: Sparkle
      - package: AmplitudeSwift
      - package: Sentry
        product: SentrySPM
    info:
      path: CoachCap/Info.plist
      properties:
        CFBundleShortVersionString: "1.9.5"
        CFBundleVersion: "84"
        CFBundleIconName: AppIcon
        NSCameraUsageDescription: "CoachCap uses your camera to record a face-cam overlay on your screen recordings."
        NSMicrophoneUsageDescription: "CoachCap uses your microphone to record audio commentary with your screen recordings."
        NSSpeechRecognitionUsageDescription: "CoachCam transcribes recordings on your Mac so you can search for a word and jump straight to it while editing. Audio never leaves your Mac."
        SUFeedURL: "https://raw.githubusercontent.com/spectrevisuals/CoachCam/main/appcast.xml"
        SUPublicEDKey: "rduKIaou/mAjUKF6/eOVw5+kc2grUFBw1kncIoqqRaA="
        SUEnableAutomaticChecks: true
        # Expanded at build time from the SENTRY_DSN build setting (see configFiles above).
        # Empty = telemetry never starts.
        SentryDSN: $(SENTRY_DSN)
    entitlements:
      path: CoachCap/CoachCap-Release.entitlements
      properties:
        # Hardened Runtime device-access keys. NOTE: the mic key for hardened runtime is
        # `audio-input`, NOT `microphone` (that one is App Sandbox only). Shipping only
        # `microphone` silently blocked the mic prompt while camera worked. Keep all three.
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
    configurations:
      Debug:
        settings:
          CODE_SIGN_ENTITLEMENTS: CoachCap/CoachCap.entitlements
    # Archive builds only (runOnlyWhenInstalling) and Release only (checked inside the script).
    # The phase calls the script file rather than embedding it, so the file stays the single
    # source of truth, and every path exits 0: a missing tool, token or network connection can
    # never fail the build or affect signing. Script phases are not copied into the app bundle.
    postBuildScripts:
      - name: Upload dSYMs to Sentry
        script: |
          if [ -f "${SRCROOT}/Scripts/upload_dsyms.sh" ]; then
            /bin/bash "${SRCROOT}/Scripts/upload_dsyms.sh" || echo "note: dSYM upload script exited non-zero (ignored)"
          else
            echo "note: Scripts/upload_dsyms.sh not found, skipping dSYM upload"
          fi
          exit 0
        runOnlyWhenInstalling: true
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${EXECUTABLE_NAME}

  # Hostless logic-test bundle. Compiles the dependency-free logic files (e.g. PhotoMatching)
  # directly, so tests run fast & headless with no app host / code injection / signing.
  CoachCapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: CoachCap/PhotoTool/PhotoMatching.swift
      - path: CoachCap/Export/VideoTrimmer.swift
      - path: CoachCap/Export/VideoTranscriber.swift
      - path: CoachCap/Models/RecordingConfig.swift
      - path: CoachCap/Recording/DisplayList.swift
      - path: CoachCap/PhotoTool/PhotoStitcher.swift
      # The frame compositor (CoreImage only): what a recorded frame contains in each mode.
      - path: CoachCap/Compositor/FrameCompositor.swift
      # Telemetry's dependency-free logic (Foundation only — no Sentry import), so the
      # privacy scrubber, the clean-exit marker and the scan classifier are unit-tested.
      # The test target must NOT depend on the Sentry package.
      - path: CoachCap/Models/TelemetryScrubber.swift
      - path: CoachCap/Models/SessionMarker.swift
    settings:
      base:
        PRODUCT_NAME: CoachCapTests
        PRODUCT_MODULE_NAME: CoachCapTests
        PRODUCT_BUNDLE_IDENTIFIER: com.coachcam.tests
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        DEVELOPMENT_TEAM: ""

schemes:
  CoachCap:
    build:
      targets:
        CoachCap: all
        CoachCapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoachCapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
